<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R-Study</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#172033;
  padding-bottom:80px;
}

.header{
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  padding:28px 20px 35px;
  border-radius:0 0 30px 30px;
}

.header h1{
  font-size:30px;
  margin-bottom:8px;
}

.header p{
  font-size:16px;
  opacity:.9;
}

.container{
  width:92%;
  max-width:700px;
  margin:auto;
}

.welcome{
  background:white;
  margin-top:-25px;
  padding:22px;
  border-radius:22px;
  box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.welcome h2{
  margin-bottom:8px;
}

.section-title{
  margin:28px 0 15px;
  font-size:24px;
}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
  box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.subject-card{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.subject-info h3{
  margin-bottom:6px;
}

.subject-info p{
  color:#6b7280;
  font-size:14px;
}

.btn{
  border:none;
  padding:11px 16px;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  margin:4px;
}

.primary{
  background:#4f46e5;
  color:white;
}

.success{
  background:#16a34a;
  color:white;
}

.danger{
  background:#ef4444;
  color:white;
}

.secondary{
  background:#e5e7eb;
  color:#172033;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:12px;
  margin:7px 0 12px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:90px;
}

label{
  font-weight:bold;
  display:block;
  margin-top:8px;
}

.hidden{
  display:none;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  display:flex;
  justify-content:space-around;
  padding:10px 5px;
  box-shadow:0 -4px 15px rgba(0,0,0,.1);
  z-index:100;
}

.nav button{
  background:none;
  border:none;
  font-size:12px;
  color:#555;
  cursor:pointer;
}

.nav span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.timer{
  text-align:center;
}

.time{
  font-size:55px;
  font-weight:bold;
  margin:20px 0;
  color:#4f46e5;
}

.timer-mode{
  font-size:18px;
  font-weight:bold;
}

.progress-bg{
  width:100%;
  height:15px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin:12px 0;
}

.progress-fill{
  height:100%;
  background:#4f46e5;
  width:0%;
  transition:.3s;
}

.task{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  border-bottom:1px solid #eee;
}

.task input{
  width:auto;
  margin:0;
}

.completed{
  text-decoration:line-through;
  color:#888;
}

.quiz-option{
  width:100%;
  text-align:left;
  margin:6px 0;
}

.quiz-question{
  font-size:19px;
  font-weight:bold;
  margin-bottom:15px;
}

.score{
  font-size:24px;
  font-weight:bold;
  text-align:center;
  margin:15px;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}
</style>
</head>

<body>

<header class="header">
  <h1>📚 R-Study</h1>
  <p>Plan • Focus • Progress</p>
</header>

<div class="container">

  <div class="welcome">
    <h2>স্বাগতম! 👋</h2>
    <p>আজকের পড়াশোনার পরিকল্পনা শুরু করি।</p>
  </div>

  <!-- HOME -->
  <section id="home">

    <h2 class="section-title">📊 আজকের Progress</h2>

    <div class="card">
      <p>সম্পন্ন Task</p>
      <div class="progress-bg">
        <div id="progressBar" class="progress-fill"></div>
      </div>
      <p id="progressText">0% সম্পন্ন</p>
    </div>

    <h2 class="section-title">📚 Subjects</h2>

    <button class="btn primary" onclick="showSection('subjects')">
      ➕ Subject যোগ করুন
    </button>

    <div id="homeSubjects"></div>

  </section>


  <!-- SUBJECTS -->
  <section id="subjects" class="hidden">

    <h2 class="section-title">📚 আমার Subjects</h2>

    <button class="btn primary" onclick="openSubjectForm()">
      ➕ Add Subject
    </button>

    <div id="subjectForm" class="card hidden">

      <h3 id="subjectFormTitle">নতুন Subject</h3>

      <label>Subject Name</label>
      <input id="subjectName" placeholder="যেমন: গণিত">

      <label>Target</label>
      <input id="subjectTarget" placeholder="যেমন: Chapter 1-5">

      <button class="btn success" onclick="saveSubject()">Save</button>
      <button class="btn secondary" onclick="closeSubjectForm()">Cancel</button>

    </div>

    <div id="subjectList"></div>

  </section>


  <!-- SCHEDULE -->
  <section id="schedule" class="hidden">

    <h2 class="section-title">📅 Study Schedule</h2>

    <div class="card">

      <label>Subject</label>
      <select id="schedule
