<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>R-Study</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #172033;
    padding-bottom: 80px;
}

/* Header */
.header {
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: white;
    padding: 28px 20px;
    border-radius: 0 0 28px 28px;
}

.header h1 {
    font-size: 30px;
    margin-bottom: 6px;
}

.header p {
    opacity: 0.9;
    font-size: 14px;
}

/* Main */
.container {
    width: 92%;
    max-width: 700px;
    margin: auto;
}

/* Welcome */
.welcome {
    background: white;
    margin-top: -20px;
    padding: 20px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.welcome h2 {
    margin-bottom: 7px;
}

.welcome p {
    color: #6b7280;
    font-size: 14px;
}

/* Section */
.section-title {
    margin: 25px 0 12px;
    font-size: 20px;
}

/* Cards */
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    cursor: pointer;
    transition: 0.2s;
}

.card:active {
    transform: scale(0.97);
}

.icon {
    font-size: 30px;
    margin-bottom: 10px;
}

.card h3 {
    font-size: 16px;
    margin-bottom: 5px;
}

.card p {
    color: #777;
    font-size: 12px;
}

/* Add subject */
.add-subject {
    margin-top: 15px;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: #4f46e5;
    color: white;
    font-size: 16px;
    font-weight: bold;
}

/* Progress */
.progress-box {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-top: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.06);
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
}

.progress-bar {
    width: 100%;
    height: 10px;
    background: #e5e7eb;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    width: 35%;
    height: 100%;
    background: #4f46e5;
}

/* Bottom Navigation */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 68px;
    background: white;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
    z-index: 10;
}

.nav-item {
    text-align: center;
    color: #777;
    font-size: 11px;
}

.nav-item span {
    display: block;
    font-size: 23px;
    margin-bottom: 3px;
}

.nav-item.active {
    color: #4f46e5;
    font-weight: bold;
}

/* Popup */
.popup {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
    z-index: 20;
}

.popup-box {
    background: white;
    width: 88%;
    max-width: 400px;
    padding: 25px;
    border-radius: 20px;
}

.popup-box h2 {
    margin-bottom: 15px;
}

.popup-box input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    margin-bottom: 12px;
    font-size: 15px;
}

.popup-buttons {
    display: flex;
    gap: 10px;
}

.popup-buttons button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
}

.save {
    background: #4f46e5;
    color: white;
}

.cancel {
    background: #e5e7eb;
}
</style>
</head>

<body>

<!-- Header -->
<div class="header">
    <h1>📚 R-Study</h1>
    <p>Plan • Focus • Progress</p>
</div>

<div class="container">

    <!-- Welcome -->
    <div class="welcome">
        <h2>স্বাগতম! 👋</h2>
        <p>আজকের পড়াশোনার পরিকল্পনা শুরু করি।</p>
    </div>
